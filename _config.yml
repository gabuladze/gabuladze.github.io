# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Giorgi Abuladze's personal website
description: >- # this means to ignore newlines until next config var
  Software engineer in Tbilisi, Georgia. Nine years building backend systems that move money.
author:
  name: Giorgi Abuladze
  email: itisabu@gmail.com
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://abula.dev" # the base hostname & protocol for your site
repository: gabuladze/gabuladze.github.io

# Without this, the github-pages gem defaults the theme to jekyll-theme-primer
# and builds a 136 KB assets/css/style.css into the site that nothing links to.
# Disabling the theme drops the github-pages plugin defaults too, so jekyll-seo-tag
# (used by _layouts/main.html) has to be requested back explicitly.
theme: null
plugins:
  - jekyll-seo-tag

# Keep working files out of the published site. Without this, the
# jekyll-optional-front-matter plugin that GitHub Pages loads turns any
# stray .md file in the repo root into a live page.
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
